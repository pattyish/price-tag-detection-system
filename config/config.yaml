# Price Detection System Configuration
# This is the main configuration file for the system

model:
  model_name: "yolov8m"  # Options: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  pretrained: true
  device: "cuda"  # cuda or cpu
  confidence_threshold: 0.5
  iou_threshold: 0.4
  imgsz: 640
  batch_size: 16

ocr:
  engine: "easyocr"  # easyocr or tesseract
  languages:
    - "en"
  gpu: true
  confidence_threshold: 0.5

data:
  data_dir: "data"
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_split: 0.7
  val_split: 0.2
  test_split: 0.1
  img_size: 640
  augment: true

training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 20
  save_period: 10
  device: "cuda"
  workers: 4
  seed: 42

inference:
  model_path: "models/weights/best.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.4
  max_detections: 100
  imgsz: 640

api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  workers: 4
  reload: true
  max_upload_size: 52428800

logging:
  log_dir: "logs"
  log_level: "INFO"
  enable_console: true
  enable_file: true
  enable_json: true
  max_bytes: 10485760
  backup_count: 5
